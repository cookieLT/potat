<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a19">
<title>Po Tat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A9%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f1; --surf:#fcfcfb; --surf2:#eeede9; --ink:#0b0b0b; --ink2:#52514e;
  --muted:#898781; --line:#e1e0d9; --accent:#2a78d6; --ring:rgba(11,11,11,.10);
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --h0:#eeede9; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#2a78d6; --h6:#184f95;
  --shadow:0 1px 2px rgba(11,11,11,.06),0 6px 18px rgba(11,11,11,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0d0d; --surf:#1a1a19; --surf2:#242422; --ink:#fff; --ink2:#c3c2b7;
    --muted:#898781; --line:#2c2c2a; --accent:#3987e5; --ring:rgba(255,255,255,.10);
    --good:#0ca30c; --warn:#fab219; --crit:#e66767;
    --h0:#242422; --h1:#104281; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#9ec5f4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surf:#1a1a19; --surf2:#242422; --ink:#fff; --ink2:#c3c2b7;
  --muted:#898781; --line:#2c2c2a; --accent:#3987e5; --ring:rgba(255,255,255,.10);
  --good:#0ca30c; --warn:#fab219; --crit:#e66767;
  --h0:#242422; --h1:#104281; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#6da7ec; --h6:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior-y:none}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.hide{display:none!important}

header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 14px 8px;
  border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px}
.hname{font-size:19px;font-weight:700;letter-spacing:-.01em}
.hage{font-size:12px;color:var(--muted);margin-top:1px}
.hbtn{margin-left:auto;width:38px;height:38px;border-radius:12px;background:var(--surf2);
  display:grid;place-items:center;font-size:17px}
.stats{display:flex;gap:6px;overflow-x:auto;margin-top:9px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--surf);border:1px solid var(--ring);border-radius:999px;
  padding:5px 11px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.pill b{color:var(--ink);font-weight:700}
.pill.alert{border-color:var(--warn);color:var(--ink)}

main{padding:12px 14px 132px;max-width:560px;margin:0 auto}

/* ---- log grid ---- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;background:var(--surf);border:1px solid var(--ring);border-radius:18px;
  min-height:94px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;box-shadow:var(--shadow);transition:transform .06s ease}
.tile:active{transform:scale(.95)}
.tile .em{font-size:29px;line-height:1}
.tile .lb{font-size:12.5px;font-weight:650;color:var(--ink2)}
.tile.live{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.tile .timer{font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tile .dot{position:absolute;top:8px;right:9px;font-size:10px;font-weight:800;color:var(--muted)}

.live-banner{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--accent);
  border-radius:14px;padding:9px 12px;margin-bottom:10px;font-size:14px;font-weight:600}
.live-banner .t{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700}

/* ---- quick bar ---- */
#quick{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom));z-index:30;
  padding:0 10px 8px}
.qcard{background:var(--surf);border:1px solid var(--ring);border-radius:16px;padding:9px 10px;
  box-shadow:var(--shadow);max-width:540px;margin:0 auto}
.qtop{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.qtop .qt{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.qtop .x{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--surf2);
  display:grid;place-items:center;font-size:15px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.chip{border:1px solid var(--ring);border-radius:999px;padding:6px 11px;font-size:13px;
  font-weight:600;background:var(--surf2);color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.mini{padding:5px 9px;font-size:12px}
.chip.danger.on{background:var(--crit);border-color:var(--crit)}

/* ---- timeline ---- */
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:16px 2px 8px}
.tl{background:var(--surf);border:1px solid var(--ring);border-radius:16px;overflow:hidden}
.ev{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border-top:1px solid var(--line);
  width:100%;text-align:left;background:none}
.ev:first-child{border-top:0}
.ev .em{font-size:21px;line-height:1.15}
.ev .mid{flex:1;min-width:0}
.ev .t1{font-size:14.5px;font-weight:650}
.ev .t2{font-size:12.5px;color:var(--ink2);margin-top:2px;word-break:break-word}
.ev .tm{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  text-align:right;padding-top:2px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 14px}

/* ---- generic cards ---- */
.card{background:var(--surf);border:1px solid var(--ring);border-radius:16px;padding:13px;margin-bottom:10px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.st{background:var(--surf);border:1px solid var(--ring);border-radius:14px;padding:11px 12px}
.st .k{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.st .v{font-size:23px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.st .s{font-size:11.5px;color:var(--ink2);margin-top:1px}
.feedbig{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.feedsub{font-size:14px;color:var(--ink2);margin-top:3px;font-weight:600}
.cross{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.cross .ck{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.cross .cv{font-size:17px;font-weight:700;margin-top:2px}
.cross .cs{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.tm2.cont{color:var(--line);font-size:15px;text-align:right;padding-right:4px}
.tm2{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--muted);
  min-width:62px;padding-top:3px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px;border-radius:20px;margin-bottom:2px}
.k-out{background:rgba(12,163,12,.14);color:var(--good)}
.k-meal{background:rgba(250,178,25,.16);color:#8a6100}
.k-nap{background:rgba(41,120,214,.13);color:var(--accent)}
.k-free{background:var(--surf2);color:var(--ink2)}
.k-pen{background:var(--surf2);color:var(--muted)}
.k-outing{background:rgba(139,111,212,.16);color:#6b4fb8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-outing{color:#b9a3ee}}
:root[data-theme="dark"] .k-outing{color:#b9a3ee}
.k-bed{background:rgba(208,59,59,.13);color:var(--crit)}
.tdot{width:24px;height:24px;border-radius:50%;background:var(--surf2);color:var(--muted);
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:0 0 auto}
.tdot.due{background:var(--warn);color:#3a2a00}
.tdot.done{background:var(--good);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .k-meal{color:var(--warn)}}
:root[data-theme="dark"] .k-meal{color:var(--warn)}
.bar{height:7px;border-radius:99px;background:var(--surf2);margin:10px 0 9px;overflow:hidden}
.barf{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.rep{font-size:10.5px;font-weight:700;color:var(--accent);letter-spacing:.03em;text-transform:uppercase}
.emcard{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit) inset}
.emh{font-size:17px;font-weight:700;color:var(--crit);letter-spacing:-.01em}
.emb{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.5}
a.tel{display:block;margin-top:11px;text-decoration:none;background:var(--crit);color:#fff;
  border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:15px}
.segs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.segs::-webkit-scrollbar{display:none}

/* ---- heatmap ---- */
.hm{width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed}
.hm td{height:15px;border-radius:3px;background:var(--h0)}
.hm .lab{width:34px;background:none;font-size:10px;color:var(--muted);text-align:right;padding-right:2px}
.hmx{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);
  margin:4px 0 0 38px;font-variant-numeric:tabular-nums}
.legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:9px}
.legend i{width:15px;height:11px;border-radius:3px;display:inline-block}

/* ---- day rows ---- */
.day{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.day:first-child{border-top:0}
.day .dn{font-size:14px;font-weight:650;flex:0 0 auto}
.day .ds{font-size:12.5px;color:var(--ink2);margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}

/* ---- forms ---- */
.row{display:flex;gap:8px;align-items:center}
input[type=text],input[type=number],input[type=time],input[type=date],textarea,select{
  width:100%;background:var(--surf2);border:1px solid var(--ring);border-radius:11px;
  padding:11px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical}
.btn{background:var(--accent);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;
  font-weight:650;text-align:center;flex:1}
.btn.ghost{background:var(--surf2);color:var(--ink)}
.btn.dngr{background:var(--crit)}
.lbl{font-size:12px;font-weight:650;color:var(--muted);margin:11px 2px 5px;text-transform:uppercase;letter-spacing:.05em}

/* ---- tabs ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--surf);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:650;color:var(--muted)}
nav button .ne{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}

/* ---- sheet ---- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surf);
  border-radius:20px 20px 0 0;padding:14px 15px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#sheet h3{margin:2px 0 12px;font-size:17px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.shclose{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:11px;
  background:var(--surf2);display:grid;place-items:center;font-size:16px;color:var(--ink2)}
#sheet{position:fixed}
.mile{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.mile:first-child{border-top:0}
.mile .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;font-size:14px;color:#fff}
.mile .ck.on{background:var(--good);border-color:var(--good)}
.mile .mt{font-size:14px;font-weight:600}
.mile .ms{font-size:12px;color:var(--muted);margin-top:2px}
.mile.done .mt{text-decoration:line-through;color:var(--muted)}
.warnbar{background:var(--warn);color:#0b0b0b;font-size:13px;font-weight:600;padding:9px 14px;text-align:center}
.tiny{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.typerow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.typerow:first-child{border-top:0}
.typerow .th{font-size:20px}
.typerow .tn{font-size:14px;font-weight:600;flex:1}
.mv{width:32px;height:32px;border-radius:9px;background:var(--surf2);display:grid;place-items:center;font-size:13px}
</style>
</head>
<body>

<div id="warn" class="warnbar hide"></div>

<header>

    <div>
      <div class="hname">🐩 Po Tat</div>
      <div class="hage" id="age"></div>
    </div>
    <button class="hbtn" id="gear" aria-label="Settings">⚙️</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section id="v-day"></section>
  <section id="v-care" class="hide"></section>
  <section id="v-soc" class="hide"></section>
  <section id="v-rec" class="hide"></section>
  <section id="v-log" class="hide"></section>
  <section id="v-today" class="hide"></section>
  <section id="v-hist" class="hide"></section>
</main>

<div id="quick"></div>

<nav>

<div id="scrim" class="hide"></div>
<div id="sheet" class="hide"></div>

var ROUTINE_DEF={
  dayStart:"11:00", dayCap:"12:30", loopStart:"", loopDay:"", penClose:"23:30",
  cycle:{free:60,out:5,nap:85},          // 150 minutes, one turn of the loop
  meals:4, snack:true,                   // §12: small snack or warm goat milk before the crate
  out:{on:false, start:"14:00", mins:120, withHer:true},   // an errand or an outing
  inv:{maxPenned:780, maxFast:780, minMealGap:120}   // 13h penned, 13h fast, 2h apart
};

function defaultDB(){return{v:1,events:[],weights:[],types:JSON.parse(JSON.stringify(DEFAULT_TYPES)),
  miles:JSON.parse(JSON.stringify(DEFAULT_MILES)),done:{},
  routine:JSON.parse(JSON.stringify(ROUTINE_DEF)),
  rec:{chip:"",chipReg:"",vet:"",vetTel:"",er:"",erTel:"",ins:"",insNo:"",breeder:"",breederTel:"",vax:[],notes:""},
  settings:{theme:"auto",unit:"lb",adultLb:20,adultSet:false,meals:3},
  seq:1,did:newDeviceId(),idv:2};}

/* Every record carries an id that is unique across devices, so a second phone
   syncing in later can never mint the same id as this one. */
function newDeviceId(){
  var s="";for(var i=0;i<5;i++)s+="abcdefghijkmnpqrstuvwxyz23456789"[Math.floor(Math.random()*32)];
  return s;
}
function newId(){return DB.did+"-"+(DB.seq++).toString(36);}

var DB;
/* Brings any saved shape — old key, old id scheme, a backup pasted in from an
   earlier build — up to what the current app expects. Used by load() AND by
   restore, so a restored backup is never left half-formed. */
function normalize(d){
    var b=defaultDB();
    var needsIdUpgrade=(d.idv!==2);   // read BEFORE defaults are merged in
    for(var k in b){if(!(k in d))d[k]=b[k];}
    // merge in any newly-shipped default types the user doesn't have
    var have={};d.types.forEach(function(t){have[t.id]=1;});
    DEFAULT_TYPES.forEach(function(t){if(!have[t.id])d.types.push(JSON.parse(JSON.stringify(t)));});
    // refresh the built-in buttons from the current defaults, keeping the user's
    // order and hidden flags — custom buttons are never touched
    d.types.forEach(function(t){
      if(t.custom)return;
      for(var j=0;j<DEFAULT_TYPES.length;j++){
        if(DEFAULT_TYPES[j].id!==t.id)continue;
        var src=DEFAULT_TYPES[j];
        t.em=src.em;t.lb=src.lb;t.mode=src.mode;t.settle=src.settle;
        t.chips=JSON.parse(JSON.stringify(src.chips||[]));
      }
    });
    d.events.sort(function(a,b){return a.ts-b.ts;});
    if(!d.did)d.did=newDeviceId();
    if(needsIdUpgrade){                  // one-time upgrade from plain counter ids
      d.events.forEach(function(e){e.i=d.did+"-c"+e.i;});
      d.idv=2;
    }
    d.weights.forEach(function(w,k){if(!w.id)w.id=d.did+"-w"+k+"-"+w.ts;});
    for(var sk in b.settings){if(!(sk in d.settings))d.settings[sk]=b.settings[sk];}
    if(!d.routine)d.routine=b.routine;
    for(var rq in b.routine){if(!(rq in d.routine))d.routine[rq]=b.routine[rq];}
    if(!d.routine.inv)d.routine.inv=b.routine.inv;
    if(!d.rec)d.rec=b.rec;
    for(var rk in b.rec){if(!(rk in d.rec))d.rec[rk]=b.rec[rk];}
    // ship any new default milestones the user hasn't got (repeating ones especially)
    var mh={};d.miles.forEach(function(m){mh[m.id]=1;});
    DEFAULT_MILES.forEach(function(m){if(!mh[m.id])d.miles.push(JSON.parse(JSON.stringify(m)));});
    // until the owner sets it herself, follow the shipped default
    if(!d.settings.adultSet)d.settings.adultLb=b.settings.adultLb;
    return d;
}
function load(){
  try{var raw=localStorage.getItem(KEY);
    if(!raw){raw=localStorage.getItem(OLDKEY);   // renamed from Violet — keep anything already logged
      if(raw)localStorage.setItem(KEY,raw);}
    if(!raw)return defaultDB();
    return normalize(JSON.parse(raw));
  }catch(e){return defaultDB();}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(DB));}
  catch(e){storageOK=false;showWarn();}
}
DB=load();
save();   // write the normalised/upgraded shape straight back, don't wait for the first tap

function showWarn(){
  var w=document.getElementById("warn");
  w.classList.remove("hide");
  w.textContent="⚠️ This device isn't saving data here. Tap Settings → Backup and read the note.";
}
if(!storageOK)showWarn();

/* ============================ helpers ============================ */
var $=function(s){return document.querySelector(s);};
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function typeOf(id){for(var i=0;i<DB.types.length;i++)if(DB.types[i].id===id)return DB.types[i];
  return{id:id,em:"❔",lb:id,mode:"instant",chips:[]};}
function pad(n){return n<10?"0"+n:""+n;}
function dayKey(ts){var d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function keyToDate(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtTime(ts){var d=new Date(ts),h=d.getHours(),m=d.getMinutes(),ap=h<12?"am":"pm";
  h=h%12;if(h===0)h=12;return h+":"+pad(m)+ap;}
function fmtDur(ms){if(ms<0)ms=0;var mi=Math.round(ms/60000);
  if(mi<60)return mi+"m";var h=Math.floor(mi/60);return h+"h "+pad(mi%60)+"m";}
function fmtAgo(ts){var d=Date.now()-ts;if(d<60000)return "just now";
  if(d>=86400000){var dy=Math.floor(d/86400000);return dy+(dy===1?" day ago":" days ago");}
  return fmtDur(d)+" ago";}
function mealByTime(ts){var h=new Date(ts).getHours();
  if(h<10)return "Breakfast";if(h<15)return "Lunch";if(h<21)return "Dinner";return "Snack";}
function ageText(){
  var ms=Date.now()-BORN.getTime();var d=Math.floor(ms/86400000);
  var w=Math.floor(d/7),r=d%7;
  var mo=Math.floor(d/30.4375);
  return w+" weeks"+(r?" "+r+"d":"")+"  ·  "+mo+" mo  ·  born Jun 7, 2026";
}
function vibe(ms){if(navigator.vibrate)try{navigator.vibrate(ms||12);}catch(e){}}
function metaText(ev){
  var t=typeOf(ev.t),out=[];
  if(t.chips)t.chips.forEach(function(c){if(ev.meta&&ev.meta[c.g])out.push(ev.meta[c.g]);});
  if(ev.meta)for(var k in ev.meta){if(out.indexOf(ev.meta[k])<0&&ev.meta[k])out.push(ev.meta[k]);}
  return out.join(" · ");
}
function openSessions(){return DB.events.filter(function(e){return e.end===null&&e.end!==undefined;});}
function openOf(id){var best=null;
  DB.events.forEach(function(e){if(e.t===id&&e.end===null&&(!best||e.ts>best.ts))best=e;});return best;}
function dur(ev,now){var e=ev.end||now||Date.now();return e-ev.ts;}

/* ---- settle time: how long from being left alone until she goes quiet ----
   Stored outside meta so it never shows up as a stray chip label. */
function markSettled(i){
  var e=evById(i);if(!e)return;
  e.st=Date.now();
  if(!e.meta.Then)e.meta.Then="Settled";
  save();vibe(14);renderAll();showQuick(e,"");
}
function settleMs(ev){return (ev.st&&ev.st>=ev.ts)?ev.st-ev.ts:null;}
function fmtShort(ms){                       // seconds matter here; fmtDur rounds to minutes
  var s=Math.round(ms/1000);
  if(s<60)return s+"s";
  return Math.floor(s/60)+"m "+pad(s%60)+"s";
}

/* ============================ the daily loop ============================
   Offsets, not clock times. Two anchors, because "pen opens" was doing four
   jobs at once and on a weekend they come apart:

     dayStart  — her first potty and first meal. Tied to HER morning.
                 Capped: it must not drift with whoever is still asleep.
     loopStart — when supervised free time can begin. Tied to the owner's morning.

   On a weekday they are the same time and nothing changes. On a weekend
   dayStart holds while loopStart slides, and she is fed and emptied in
   between rather than penned through it.

   Some quantities must NOT scale with the anchors — a longer lie-in cannot
   mean a longer fast. Those are invariants, checked and reported, never
   silently absorbed. */
function rmins(v){var p=String(v||"").split(":");return (+p[0])*60+(+p[1]||0);}
function rfmt(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),x=m%60,s=h<12?"am":"pm";
  h=h%12||12;return h+":"+pad(x)+s;}
function rdur(m){m=Math.round(m);return Math.floor(m/60)+"h"+(m%60?pad(m%60):"");}

/* Lay out one day. Pure — give it anchors, get back steps plus the numbers
   that decide whether the day is actually acceptable. */
var RANK={out:0,meal:1,outing:2,free:3,nap:4,pen:5,bed:6};
/* Nothing edible may sit inside a nap. Runs after meal placement AND again
   after an outing reflows the day, because the outing creates a nap of its
   own that the first pass could not have seen. */
function repairMeals(meals,S,napLen,close){
  var napR=[],shifted=0;
  S.forEach(function(x){if(x.k==="nap")napR.push([x.t,x.t+(x.len||napLen)]);});
  for(var mi=0;mi<meals.length;mi++){
    for(var ni=0;ni<napR.length;ni++){
      if(meals[mi]>napR[ni][0]&&meals[mi]<napR[ni][1]){
        var toEnd=napR[ni][1]-meals[mi], toStart=meals[mi]-napR[ni][0];
        var moved=(toEnd<=toStart)?napR[ni][1]:napR[ni][0];
        if(moved>close-45)moved=napR[ni][0];
        if(mi>0&&moved<=meals[mi-1])moved=napR[ni][1];
        meals[mi]=moved; shifted++;
        break;
      }
    }
  }
  meals.sort(function(x,y){return x-y;});
  return shifted;
}
/* A nap runs until the next thing in the day, whatever that is. Naps are
   remainders now, so this is what makes overlapping ones structurally
   impossible after an outing has reflowed the day. A MEAL is deliberately not
   allowed to end one — being woken to eat is the thing repairMeals exists to
   catch, and truncating here would hide it instead. */
function fitNaps(S,close){
  var o=S.slice().sort(function(x,y){return (x.t-y.t)||(RANK[x.k]-RANK[y.k]);});
  o.forEach(function(x,i){
    if(x.k!=="nap")return;
    var end=close;
    for(var j=i+1;j<o.length;j++){if(o[j].t>x.t&&o[j].k!=="meal"){end=o[j].t;break;}}
    x.len=Math.max(0,Math.min(x.len==null?end-x.t:x.len,end-x.t));
  });
}
function buildDay(a){
  var open=rmins(a.dayStart), close=rmins(a.penClose);
  var loop=a.loopStart?rmins(a.loopStart):open;
  if(close<=open)close+=1440;
  if(loop<open)loop+=1440;
  if(loop>close-60)loop=close-60;                 // nonsense guard
  var C=a.cycle, S=[];

  /* Block geometry. Every one of these is a real interval in her day, which
     is why the nap is what is LEFT of a block rather than a number imposed
     on it. Change one and the naps absorb it; that is the intent. */
  var LEAD=10,      // out of the pen, to the corner and back — then the meal
      POST=15,      // the gastrocolic window: the trip the meal does the work on
      CAT=10,       // block 1 trades its free hour for a short cat session
      TAIL=45,      // bedtime snack -> pen closes
      EVENAP=70,    // the last nap, between the wind-down and the snack
      MINFREE=15, MINNAP=20;
  var EVENING=POST+C.out+C.free+C.out+EVENAP+TAIL;   // 3h20 at the shipped cycle

  /* ---- meals first. They are what the day hangs off, not what gets fitted
     around it. Meal 1 sits at her morning; the last one sits far enough from
     the pen closing to hold a wind-down, a nap and the snack. The rest divide
     what is between them.

     Block 1 is short on purpose: after a twelve-hour night she needs the trip,
     the food and more sleep, not an hour of play. It trades its free hour for
     a few minutes with the cats, so its gap runs an hour shorter than the
     others rather than leaving her idle. */
  var nm=Math.max(1,a.meals|0), k=nm-1;
  var m0=open+LEAD, hardL=close-TAIL-MINNAP, mL=close-EVENING;
  if(k>0&&mL<m0+a.inv.minMealGap*k)mL=m0+a.inv.minMealGap*k;  // reach for legal gaps
  if(mL>hardL)mL=hardL;                                       // but never past her bedtime
  if(mL<m0)mL=m0;
  /* A block needs its trip, its meal, the fifteen minutes and a nap worth the
     name. Below that the day genuinely does not hold this many meals, and the
     honest answer is to feed fewer and say so — not to stack them on top of
     each other. */
  var span=mL-m0, MINBLOCK=45, dropped=0;
  while(k>0&&span<k*MINBLOCK){k--;dropped++;}
  var meals=[m0];
  if(k===1)meals.push(m0+span);
  else if(k>1){
    var D=Math.min(C.free,Math.max(0,(span-k*a.inv.minMealGap)/(k-1)));
    var g=(span+D)/k;
    for(var q=1;q<=k;q++)meals.push(Math.round(m0+(g-D)+(q-1)*g));
    meals[k]=m0+span;                             // pin the last one exactly
  }

  /* ---- one block per meal:  out · meal · wait 15 · out · free · out · nap
     She goes into free time already empty, which is when accidents do not
     happen. Cat sessions sit after the meal, not before it — §10's "fed,
     emptied, not yet tired". */
  var naps=0, wind=null, snackAt=close-TAIL;
  for(var bi=0;bi<=k;bi++){
    var mt=meals[bi], last=(bi===k);
    S.push({t:mt-LEAD,k:"out",lbl:"Outside",note:bi===0?
      "Straight out of the pen, before anything else. Carry her to the corner.":
      "Straight out of the pen, no exceptions. Before the food, not after."});
    S.push({t:mt,k:"meal",lbl:"Meal "+(bi+1),
      note:last?"Last of the day. Outside 15 minutes after.":"Outside again 15 minutes after she finishes."});
    S.push({t:mt+POST,k:"out",lbl:"Outside",
      note:"Fifteen minutes after the meal. This is the trip the reflex does the work on — it is the highest-yield one you get."});

    var after=mt+POST+C.out, end=last?snackAt:(meals[bi+1]-LEAD);
    var fs=Math.max(after,loop);
    var flen=(bi===0&&!last)?CAT:C.free;
    var room=end-fs-C.out-MINNAP;
    if(room>=MINFREE){
      if(flen>room)flen=room;
      S.push({t:fs,k:"free",lbl:last?"Wind-down":"Free time",cyc:fs,note:last?
        "Calm only. No wrestling, no zoomies before bed.":
        (bi===0?"Cat session goes here — fed, emptied, not yet tired. Short, her on a leash, cats free to leave.":
                "Supervised, and she is already empty. Let it run longer if she is settled and you are watching.")});
      if(last)wind=fs;
      S.push({t:fs+flen,k:"out",lbl:"Outside",note:"Then into the pen."});
      var ns=fs+flen+C.out;
      if(end-ns>=MINNAP){S.push({t:ns,k:"nap",len:end-ns,lbl:"Nap",
        note:"Until she wakes — the "+rdur(end-ns)+" is the slot, not a target. Never wake her for the schedule."});naps++;}
    }else if(end-after>=MINNAP){
      S.push({t:after,k:"nap",len:end-after,lbl:"Nap",note:fs>after?
        "Fed and emptied, and back in the pen until you are free. The "+rdur(end-after)+" is the slot, not a target.":
        "Until she wakes — the "+rdur(end-after)+" is the slot, not a target. Never wake her for the schedule."});
      naps++;
    }
  }
  // the tail has to exist before the naps can be fitted around it
  var PEND=[];

  /* The snack sits a fixed distance from the pen closing, and the last nap is
     built to end there — but the rule is checked, not assumed. It was pinned
     here once with no nap check and a later pen-close buried it mid-nap. */
  if(a.snack)PEND.push({t:snackAt,k:"meal",lbl:"Bedtime snack",
    note:"Small — or warm goat milk. §12 keeps this; the loop spec dropped it. It is what bridges the overnight gap."});
  PEND.push({t:close-15,k:"out",lbl:"Final trip outside",note:"Give her the full ten minutes. Grooming before this, not after."});
  PEND.push({t:close,k:"bed",lbl:"Tray in, pen closes",note:"Her bedtime is fixed whether or not you are still up."});
  PEND.forEach(function(x){S.push(x);});
  S.sort(function(x,y){return (x.t-y.t) || (RANK[x.k]-RANK[y.k]);});

  /* Enforced once the whole day exists, never assumed. The blocks were built
     from the meal times so nothing should be sitting in a nap — but if the
     repair ever does fire, the steps have to follow the array or the two
     disagree, and the measurements would then describe a day she isn't having. */
  fitNaps(S,close);
  var shifted=dropped+repairMeals(meals,S,C.nap,close);
  if(shifted){var ms=S.filter(function(x){return x.k==="meal"&&x.lbl.indexOf("snack")<0;})
                      .sort(function(x,y){return x.t-y.t;});
    ms.forEach(function(st,i){if(meals[i]!==undefined)st.t=meals[i];});
    S.sort(function(x,y){return (x.t-y.t) || (RANK[x.k]-RANK[y.k]);});}
  var n=naps;
  /* ---- an outing or an errand displaces part of the day ----
     Two quite different cases. If she comes, the block is her free time and
     the cost is paid afterwards: novelty tires a puppy far more than it looks,
     so the return leads into a protected nap. If she stays home she is penned
     through it, rested by the time you are back, and what she needs is a trip
     and then free time — not more rest. */
  var O=a.out, away=null;
  var snackT=snackAt;
  if(O&&O.on){
    var os=rmins(O.start), oe=os+Math.max(15,O.mins|0);
    if(os<open)os=open; if(oe>close-30)oe=close-30;
    if(oe>os+10){
      away={s:os,e:oe,withHer:!!O.withHer};
      var keep=[], moved=[];
      S.forEach(function(x){
        if(x.t>os-5&&x.t<oe&&x.k!=="bed"){ if(x.k==="meal")moved.push(x); return; }
        keep.push(x);
      });
      S=keep;
      S.push({t:Math.max(open,os-10),k:"out",lbl:"Outside before you leave",
        note:"Empty her first — it is the difference between an outing and an incident."});
      S.push({t:os,k:away.withHer?"outing":"pen",
        lbl:away.withHer?"Out — she comes":"Home in the pen",
        note:away.withHer?
          "Crated in the car, lifted in and out, never tethered by the neck. Carried on the store floor until she is fully vaccinated. This is her free block — count it as socialisation, not extra to it.":
          "She is penned with the tray for "+rdur(oe-os)+". A missed cycle, so the tray earns its keep here."});
      S.push({t:oe,k:"out",lbl:"Outside the moment you're back",
        note:away.withHer?"Before anything else, even the shopping.":"She has been holding it. Straight out."});
      var after=oe+10;
      moved.forEach(function(mv){
        mv.t=after; mv.note="Pushed back — it fell while you were out."; S.push(mv);
        after=mv.t+Math.max(45,a.inv.minMealGap/2);
      });
      /* Don't stack a new block on top of the lattice — if the cycle already
         has one coming up, adopt it. Inserting blindly produced overlapping
         naps and squeezed a meal between them. */
      var want=after+(moved.length?30:15), kind=away.withHer?"nap":"free", found=null;
      S.forEach(function(x){
        if(x.k===kind&&x.t>=oe&&x.t<=want+90&&(!found||x.t<found.t))found=x;
      });
      var note=away.withHer?
        "She will be more tired than she looks. Let it run long; do not trim it because she seems wired.":
        "She has rested while you were out — she needs the company, not another nap.";
      if(found){
        if(away.withHer)found.lbl="Nap — protect this one";
        found.note=note;
      }else S.push({t:want,k:kind,len:kind==="nap"?C.nap:undefined,lbl:away.withHer?"Nap — protect this one":"Free time",note:note});
      // meals list follows the steps so the measurements stay honest
      fitNaps(S,close);                          // the reflow moved things under the naps
      var mealSteps=S.filter(function(x){return x.k==="meal"&&x.lbl.indexOf("snack")<0;})
                     .sort(function(x,y){return x.t-y.t;});
      meals=mealSteps.map(function(x){return x.t;});
      shifted+=repairMeals(meals,S,C.nap,close);   // the protected nap is new
      mealSteps.forEach(function(st,i){st.t=meals[i];});
      var snk=null;S.forEach(function(x){if(x.lbl==="Bedtime snack")snk=x;});
      if(snk){                                   // same rule, same reason
        var pair=[0,snk.t];
        if(repairMeals(pair,S,C.nap,close)){
          var want2=Math.min(pair[1],close-20), safe=want2;
          S.forEach(function(x){                 // if clamping lands back in a nap, go before it
            if(x.k==="nap"&&want2>x.t&&want2<x.t+(x.len||C.nap))safe=x.t-5;
          });
          snk.t=safe; snackT=safe;
        }
      }
      S.sort(function(x,y){return (x.t-y.t)||(RANK[x.k]-RANK[y.k]);});
    }
  }

  var lastMeal=meals[meals.length-1];
  var lastFeed=a.snack?snackT:lastMeal;
  var m={
    penned:(open+1440)-close,                       // pen closes, reopens next morning
    awake:close-open,
    fast:(open+LEAD+1440)-lastFeed,                // last thing she eats → first meal
    settle:close-lastFeed,                          // last meal → pen closes
    cycles:n, wind:wind, meals:meals,
    gaps:meals.slice(1).map(function(x,i){return x-meals[i];}),
    lateStart:rmins(a.dayStart)>rmins(a.dayCap)
  };
  m.warn=[];
  if(m.lateStart)m.warn.push({k:"cap",txt:"Day started after the "+rfmt(rmins(a.dayCap))+" cap."});
  if(m.penned>a.inv.maxPenned)m.warn.push({k:"penned",txt:"Penned "+rdur(m.penned)+" overnight — past the "+rdur(a.inv.maxPenned)+" you set."});
  if(m.fast>a.inv.maxFast)m.warn.push({k:"fast",txt:rdur(m.fast)+" between her last food and her first, past the "+rdur(a.inv.maxFast)+" limit."+
    (a.snack?"":" §12 puts a small snack or warm goat milk before the crate — turning that back on is what closes this gap.")});
  if(away&&!away.withHer&&(away.e-away.s)>180)m.warn.push({k:"away",
    txt:"Penned "+rdur(away.e-away.s)+" while you are out, on top of the night. Expect the tray, and go straight out when you get back."});
  if(away&&away.withHer&&(away.e-away.s)>120)m.warn.push({k:"away",
    txt:rdur(away.e-away.s)+" out is a long trip at her age. Watch for her shutting down rather than settling, and let the nap afterwards run."});
  if(shifted)m.warn.push({k:"squeeze",txt:"The day is short for "+a.meals+" meals — "+shifted+
    " had to be dropped or moved off a nap. Either feed fewer meals or start her day earlier."});
  var tight=m.gaps.filter(function(g){return g<a.inv.minMealGap;}).length;
  if(tight)m.warn.push({k:"gap",txt:tight+" meal gap"+(tight>1?"s":"")+" under "+rdur(a.inv.minMealGap)+". Regular spacing is what makes her poop predictable."});
  return {steps:S,m:m};
}

/* Out-of-cycle trips. These are events, not scheduled steps — they hang off
   what actually happened. If nothing was logged we fall back to the planned
   time, so the rules still show up without costing a tap. */
var TRIGGERS=[
 {id:"tg-meal", src:"food",  edge:"start", mins:15, lbl:"15 minutes after a meal"},
 {id:"tg-nap",  src:"sleep", edge:"end",   mins:0,  lbl:"The moment she wakes"},
 {id:"tg-water",src:"water", edge:"start", mins:0,  lbl:"After a big drink"},
 {id:"tg-play", src:"play",  edge:"end",   mins:0,  lbl:"After any burst of play"}
];
function triggerState(now){
  now=now||Date.now();
  var wentOut=null;
  DB.events.forEach(function(e){
    if((e.t==="pee"||e.t==="poop")&&(!wentOut||e.ts>wentOut))wentOut=e.ts;
  });
  return TRIGGERS.map(function(g){
    var src=null;
    DB.events.forEach(function(e){
      if(e.t!==g.src)return;
      if(g.edge==="end"&&e.end===null)return;        // still going
      var when=g.edge==="end"?(e.end||e.ts):e.ts;
      if(!src||when>src)src=when;
    });
    if(src===null)return{g:g,state:"idle"};
    var due=src+g.mins*60000;
    if(wentOut&&wentOut>=src)return{g:g,state:"done",at:due};
    return{g:g,state:due<=now?"due":"pending",at:due};
  });
}

/* ============================ feeding guidance ============================
   Fromm Puppy Gold daily amounts, cups per day, [low, high].
   Rows are Fromm's published expected-mature-weight steps; anything between
   two steps is interpolated. Verify against the bag — labels get revised. */
var FROMM_PUPPY_GOLD={
  kcalCup:420,
  brackets:[
    {k:"6-11wk", lb:"6 to 11 weeks",  d0:0,   d1:83,
     rows:[[3,.25,.333],[5,.333,.5],[10,.5,.875],[20,.875,1.5],[30,1,1.667],[40,1.25,2],[50,1.5,2.5]]},
    {k:"3-4mo",  lb:"3 to 4 months",  d0:84,  d1:152,
     rows:[[3,.333,.5],[5,.5,.667],[10,.75,1],[20,1.25,1.75],[30,1.667,2.333],[40,2,2.875],[50,2.333,3.333]]},
    {k:"5-7mo",  lb:"5 to 7 months",  d0:153, d1:243,
     rows:[[3,.333,.5],[5,.5,.667],[10,.875,1],[20,1.333,1.75],[30,1.875,2.333],[40,2.25,3],[50,2.667,3.5]]},
    {k:"8-12mo", lb:"8 to 12 months", d0:244, d1:395,
     rows:[[3,.333,.375],[5,.5,.625],[10,.75,.875],[20,1.333,1.5],[30,1.75,2.125],[40,2.25,2.667],[50,2.667,3]]}
  ]
};
function ageDays(){return Math.floor((Date.now()-BORN.getTime())/86400000);}
function feedBracket(){
  var d=ageDays(),bs=FROMM_PUPPY_GOLD.brackets;
  for(var i=0;i<bs.length;i++)if(d<=bs[i].d1)return bs[i];
  return null;                                  // past 12 months — adult food
}
function cupsFor(bracket,adultLb){
  var r=bracket.rows,lo,hi;
  if(adultLb<=r[0][0])return[r[0][1],r[0][2]];
  if(adultLb>=r[r.length-1][0])return[r[r.length-1][1],r[r.length-1][2]];
  for(var i=0;i<r.length-1;i++){
    if(adultLb>=r[i][0]&&adultLb<=r[i+1][0]){
      lo=r[i];hi=r[i+1];
      var f=(adultLb-lo[0])/(hi[0]-lo[0]);
      return[lo[1]+(hi[1]-lo[1])*f, lo[2]+(hi[2]-lo[2])*f];
    }
  }
  return[r[0][1],r[0][2]];
}
/* Written the way a measuring cup actually reads — thirds included, because
   Fromm's own chart uses them and rounding 1⅔ to 1⅝ would misquote the label. */
var CUPFR=[[0,""],[0.125,"⅛"],[0.25,"¼"],[1/3,"⅓"],[0.375,"⅜"],[0.5,"½"],
           [0.625,"⅝"],[2/3,"⅔"],[0.75,"¾"],[0.875,"⅞"],[1,"carry"]];
function cupTxt(x){
  if(x<=0)return "0";
  var w=Math.floor(x+1e-9),f=x-w,best=CUPFR[0],bd=9;
  CUPFR.forEach(function(c){var d=Math.abs(f-c[0]);if(d<bd){bd=d;best=c;}});
  var lab=best[1];
  if(lab==="carry"){w+=1;lab="";}
  if(!w)return lab||"under ⅛";
  return w+lab;
}
/* Independent cross-check: resting energy from her actual logged weight.
   RER = 70·kg^0.75; puppies run ~2× RER to 4 months, ~1.6× after. */
function calorieCups(){
  var ws=DB.weights.slice().sort(function(a,b){return a.ts-b.ts;});
  if(!ws.length)return null;
  var w=ws[ws.length-1],kg=w.w/2.20462;
  var mult=ageDays()<122?2:1.6;
  var kcal=70*Math.pow(kg,0.75)*mult;
  return{cups:kcal/FROMM_PUPPY_GOLD.kcalCup,kcal:kcal,lb:w.w,ts:w.ts};
}

function heatmap(days,byDay,typeId){

function shade(v,max){

/* Ticking a repeating item records today and moves it to the next occurrence.
   If it is badly overdue it still lands in the future, not in the past. */
function tickRepeat(m){
  var today=new Date();today.setHours(0,0,0,0);
  m.last=dayKey(today.getTime());
  var next=keyToDate(m.d);
  if(next<today)next=new Date(today.getTime());
  var guard=0;
  do{
    if(m.rep==="week")next.setDate(next.getDate()+7);
    else if(m.rep==="month")next.setMonth(next.getMonth()+1);
    else next.setFullYear(next.getFullYear()+1);
    guard++;
  }while(next<=today&&guard<400);
  m.d=dayKey(next.getTime());
  DB.done[m.id]=false;
}

  return null;
}

    "and it travels with the rest."));
}

function feedCard(){
  var c=el("div","card"),b=feedBracket(),adult=DB.settings.adultLb||25,meals=DB.settings.meals||3;
  if(!b){
    c.appendChild(el("div","t1","She's past 12 months"));
    c.appendChild(el("div","tiny","Time to move off puppy food — switch to an adult formula over about a week, and feed to body condition rather than a chart."));
    return c;
  }
  var r=cupsFor(b,adult);
  var big=el("div","feedbig",cupTxt(r[0])+" – "+cupTxt(r[1])+" cups");
  c.appendChild(big);
  c.appendChild(el("div","feedsub","a day, split over "+meals+" meal"+(meals===1?"":"s")+
    " ≈ "+cupTxt(r[0]/meals)+" – "+cupTxt(r[1]/meals)+" cup each"));
  c.appendChild(el("div","tiny","Fromm Puppy Gold · "+b.lb+" · sized for a "+adult+" lb adult"));

  var cc=calorieCups();
  if(cc){
    var line=el("div","cross");
    var verdict;
    if(cc.cups<r[0]*0.92)verdict="below";else if(cc.cups>r[1]*1.08)verdict="above";else verdict="inside";
    line.appendChild(el("div","ck","Calorie check — from her actual weight"));
    line.appendChild(el("div","cv","≈ "+cupTxt(cc.cups)+" cups  ("+Math.round(cc.kcal)+" kcal)"));
    line.appendChild(el("div","cs",
      verdict==="below"?"Her own weight suggests less than the chart's low end. The chart assumes a puppy already tracking a "+adult+" lb curve — at "+cc.lb.toFixed(1)+" lb she isn't there yet. Start near the bottom of the range."
      :verdict==="above"?"Her weight suggests more than the chart's top end. Worth a look at whether she's growing fast or the expected adult weight is set low."
      :"Both methods agree. Anywhere in that range is reasonable."));
    c.appendChild(line);
  }else{
    c.appendChild(el("div","tiny","Log a weight below and this card will cross-check the chart against her actual size."));
  }

  var row=el("div","chips");
  var eb=el("button","chip mini","Adult weight: "+adult+" lb");
  eb.onclick=function(){
    var x=prompt("Expected adult weight in pounds\n\nThis is what she'll weigh grown, not now — it's what the Fromm chart is keyed to.",adult);
    if(x===null)return;x=parseFloat(x);if(!(x>0))return;
    DB.settings.adultLb=x;DB.settings.adultSet=true;save();renderCare();
  };
  var mb=el("button","chip mini","Meals: "+meals+"/day");
  mb.onclick=function(){
    var x=prompt("How many meals a day?",meals);
    if(x===null)return;x=parseInt(x,10);if(!(x>0&&x<9))return;
    DB.settings.meals=x;save();renderCare();
  };
  row.appendChild(eb);row.appendChild(mb);c.appendChild(row);
  var exact=false;b.rows.forEach(function(r){if(r[0]===adult)exact=true;});
  c.appendChild(el("div","tiny","Fromm's published chart for Puppy Gold"+
    (exact?", read straight off the "+adult+" lb row.":", interpolated to "+adult+" lb.")+
    " Check it against your bag — labels get revised. The real arbiter is her ribs: easily felt, not seen."));
  return c;
}
function weightChart(ws){
  var W=320,H=130,P={l:30,r:12,t:10,b:20};
  var xs=ws.map(function(w){return w.ts;}),ys=ws.map(function(w){return w.w;});
  var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs);
  var y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  if(y1===y0){y1=y0+1;}
  var pad=(y1-y0)*.15;y0-=pad;y1+=pad;
  function X(t){return P.l+(W-P.l-P.r)*((t-x0)/((x1-x0)||1));}
  function Y(v){return P.t+(H-P.t-P.b)*(1-(v-y0)/((y1-y0)||1));}
  var ns="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("width","100%");
  svg.style.marginTop="8px";svg.style.display="block";
  [y0+(y1-y0)*.5,y1-pad,y0+pad].forEach(function(gv){
    var l=document.createElementNS(ns,"line");
    l.setAttribute("x1",P.l);l.setAttribute("x2",W-P.r);l.setAttribute("y1",Y(gv));l.setAttribute("y2",Y(gv));
    l.setAttribute("stroke","var(--line)");l.setAttribute("stroke-width","1");svg.appendChild(l);
    var tx=document.createElementNS(ns,"text");
    tx.setAttribute("x",P.l-5);tx.setAttribute("y",Y(gv)+3.5);tx.setAttribute("text-anchor","end");
    tx.setAttribute("font-size","9");tx.setAttribute("fill","var(--muted)");
    tx.textContent=gv.toFixed(1);svg.appendChild(tx);
  });
  var d=ws.map(function(w,i){return (i?"L":"M")+X(w.ts).toFixed(1)+" "+Y(w.w).toFixed(1);}).join(" ");
  var p=document.createElementNS(ns,"path");
  p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke","var(--accent)");
  p.setAttribute("stroke-width","2");p.setAttribute("stroke-linejoin","round");p.setAttribute("stroke-linecap","round");
  svg.appendChild(p);
  ws.forEach(function(w){
    var c=document.createElementNS(ns,"circle");
    c.setAttribute("cx",X(w.ts));c.setAttribute("cy",Y(w.w));c.setAttribute("r","3.2");
    c.setAttribute("fill","var(--accent)");c.setAttribute("stroke","var(--surf)");c.setAttribute("stroke-width","2");
    svg.appendChild(c);
  });
  var lastw=ws[ws.length-1];
  var lt=document.createElementNS(ns,"text");
  lt.setAttribute("x",Math.min(X(lastw.ts)+6,W-P.r));lt.setAttribute("y",Y(lastw.w)-7);
  lt.setAttribute("text-anchor","end");lt.setAttribute("font-size","10");lt.setAttribute("font-weight","700");
  lt.setAttribute("fill","var(--ink)");lt.textContent=lastw.w.toFixed(1)+" lb";svg.appendChild(lt);
  return svg;
}

/* ============================ edit sheet ============================ */
function openSheet(build){
  var s=$("#sheet");s.innerHTML="";s.classList.remove("hide");$("#scrim").classList.remove("hide");
  s.appendChild(el("div","grab"));
  var cb=el("button","shclose","✕");cb.onclick=closeSheet;s.appendChild(cb);
  build(s);
}
function closeSheet(){$("#sheet").classList.add("hide");$("#scrim").classList.add("hide");}
$("#scrim").onclick=closeSheet;

function openEdit(i){
  var ev=evById(i);if(!ev)return;
  openSheet(function(s){
    var t=typeOf(ev.t);
    s.appendChild(el("h3",null,t.em+" "+t.lb));
    s.appendChild(el("div","lbl","Time"));
    var r=el("div","row");
    var din=el("input");din.type="date";din.value=dayKey(ev.ts);
    var tin=el("input");tin.type="time";
    tin.value=pad(new Date(ev.ts).getHours())+":"+pad(new Date(ev.ts).getMinutes());
    r.appendChild(din);r.appendChild(tin);s.appendChild(r);
    var ein=null;
    if(ev.end!==undefined){
      s.appendChild(el("div","lbl","End time (blank = still going)"));
      ein=el("input");ein.type="time";
      if(ev.end)ein.value=pad(new Date(ev.end).getHours())+":"+pad(new Date(ev.end).getMinutes());
      s.appendChild(ein);
    }
    (t.chips||[]).forEach(function(c){
      s.appendChild(el("div","lbl",c.g));
      var row=el("div","chips");
      c.o.forEach(function(o){
        var b=el("button","chip"+(ev.meta[c.g]===o?" on":""),o);
        b.onclick=function(){if(ev.meta[c.g]===o)delete ev.meta[c.g];else ev.meta[c.g]=o;
          save();closeSheet();openEdit(i);};
        row.appendChild(b);
      });
      s.appendChild(row);
    });
    s.appendChild(el("div","lbl","Note"));
    var ta=el("textarea");ta.value=ev.n||"";s.appendChild(ta);
    var br=el("div","row");br.style.marginTop="14px";
    var del=el("button","btn dngr","Delete");
    del.onclick=function(){if(confirm("Delete this entry?")){delEv(i);closeSheet();}};
    var sv=el("button","btn","Save");
    sv.onclick=function(){
      var p=din.value.split("-"),q=tin.value.split(":");
      if(p.length===3&&q.length>=2)ev.ts=new Date(+p[0],+p[1]-1,+p[2],+q[0],+q[1]).getTime();
      if(ein){
        if(ein.value){var e2=ein.value.split(":");
          var d2=new Date(ev.ts);d2.setHours(+e2[0],+e2[1],0,0);
          if(d2.getTime()<ev.ts)d2=new Date(d2.getTime()+86400000);
          ev.end=d2.getTime();}
        else ev.end=null;
      }
      ev.n=ta.value.trim();save();closeSheet();renderAll();
    };
    br.appendChild(del);br.appendChild(sv);s.appendChild(br);
  });
}

/* ============================ settings ============================ */
function openSettings(){
  openSheet(function(s){
    s.appendChild(el("h3",null,"Settings"));

    s.appendChild(el("div","lbl","Theme"));
    var tr=el("div","chips");
    ["auto","light","dark"].forEach(function(m){
      var b=el("button","chip"+(DB.settings.theme===m?" on":""),m[0].toUpperCase()+m.slice(1));
      b.onclick=function(){DB.settings.theme=m;save();applyTheme();closeSheet();openSettings();};
      tr.appendChild(b);
    });
    s.appendChild(tr);

    s.appendChild(el("div","lbl","Buttons — reorder, hide, or add your own"));
    var box=el("div");
    DB.types.forEach(function(t,idx){
      var row=el("div","typerow");
      row.appendChild(el("div","th",t.em));
      var nm=el("div","tn",t.lb+(t.mode==="session"?"  (start/stop)":""));
      if(t.off)nm.style.opacity=".4";
      row.appendChild(nm);
      var up=el("button","mv","↑");up.onclick=function(){if(idx>0){var a=DB.types.splice(idx,1)[0];
        DB.types.splice(idx-1,0,a);save();closeSheet();openSettings();}};
      var dn=el("button","mv","↓");dn.onclick=function(){if(idx<DB.types.length-1){var a=DB.types.splice(idx,1)[0];
        DB.types.splice(idx+1,0,a);save();closeSheet();openSettings();}};
      var hd=el("button","mv",t.off?"👁":"🚫");hd.onclick=function(){t.off=!t.off;save();closeSheet();openSettings();renderAll();};
      row.appendChild(up);row.appendChild(dn);row.appendChild(hd);
      if(t.custom){var x=el("button","mv","✕");x.onclick=function(){
        if(confirm("Remove "+t.lb+"? Past entries stay."))
        {DB.types=DB.types.filter(function(z){return z.id!==t.id;});save();closeSheet();openSettings();renderAll();}};
        row.appendChild(x);}
      box.appendChild(row);
    });
    s.appendChild(box);
    var add=el("button","btn ghost","+ Add a custom button");
    add.style.marginTop="10px";
    add.onclick=function(){
      var lb=prompt("Button label (e.g. Vet, Brush teeth, Zoomies)");if(!lb)return;
      var em=prompt("One emoji for it","⭐")||"⭐";
      var md=confirm("Does this have a start and an end (like a nap)?\n\nOK = start/stop timer\nCancel = single tap")?"session":"instant";
      var op=prompt("Optional quick-tap options, comma separated (leave blank for none)","");
      var chips=[];
      if(op&&op.trim())chips.push({g:"Detail",o:op.split(",").map(function(x){return x.trim();}).filter(Boolean)});
      DB.types.push({id:newId(),em:em.trim().slice(0,3),lb:lb.trim(),mode:md,chips:chips,custom:true});
      save();closeSheet();renderAll();openSettings();
    };
    s.appendChild(add);

    s.appendChild(el("div","lbl","Backup"));
    var br=el("div","row");
    var ex=el("button","btn ghost","Export CSV");ex.onclick=function(){download(toCSV(),"po-tat-log.csv","text/csv");};
    var bk=el("button","btn ghost","Backup file");bk.onclick=function(){download(JSON.stringify(DB),"po-tat-backup.json","application/json");};
    br.appendChild(ex);br.appendChild(bk);s.appendChild(br);
    var br2=el("div","row");br2.style.marginTop="8px";
    var cp=el("button","btn ghost","Copy backup text");
    cp.onclick=function(){
      var txt=JSON.stringify(DB);
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(function(){alert("Backup copied. Paste it somewhere safe.");},
        function(){prompt("Copy this:",txt);});
      else prompt("Copy this:",txt);
    };
    var im=el("button","btn ghost","Restore by pasting text");
    im.onclick=function(){
      var txt=prompt("Paste a backup here — this replaces everything.");
      if(!txt)return;
      try{var d=JSON.parse(txt);if(!d.events)throw 0;
        DB=normalize(d);save();closeSheet();renderAll();
        alert("Restored — "+DB.events.length+" entries.");}
      catch(e){alert("That didn't look like a backup.");}
    };
    br2.appendChild(cp);br2.appendChild(im);
    // moving from the standalone file to the installed app: pasting a long
    // backup on a phone is miserable, so offer the downloaded file first
    var fr=el("div","row");fr.style.marginTop="8px";
    var fl=el("label","btn ghost","📄 Restore from a backup file");
    fl.style.textAlign="center";fl.style.flex="1";
    var fi=el("input");fi.type="file";fi.accept=".json,application/json";fi.className="hide";
    fi.onchange=function(){
      var f=fi.files&&fi.files[0];if(!f)return;
      var rd=new FileReader();
      rd.onload=function(){
        try{var d=JSON.parse(rd.result);if(!d.events)throw 0;
          if(!confirm("Restore "+d.events.length+" entries?\n\nThis replaces everything currently in the app."))return;
          DB=normalize(d);save();closeSheet();renderAll();
          alert("Restored — "+DB.events.length+" entries.");}
        catch(e){alert("That file didn't look like a backup.");}
      };
      rd.readAsText(f);
    };
    fl.appendChild(fi);fr.appendChild(fl);s.appendChild(fr);s.appendChild(br2);
    s.appendChild(el("div","tiny","Everything lives on this phone only — nothing is uploaded anywhere. Back up now and then, especially before changing phones or clearing browser data."));
    if(!storageOK)s.appendChild(el("div","tiny","⚠️ Saving is currently blocked. That usually means the file was opened straight from Downloads. Open it in Chrome from a bookmark instead, and keep a backup."));

    var wipe=el("button","btn dngr","Erase all data");wipe.style.marginTop="16px";
    wipe.onclick=function(){if(confirm("Erase everything? This cannot be undone.")&&confirm("Really erase?")){
      DB=defaultDB();save();closeSheet();renderAll();}};
    s.appendChild(wipe);
    s.appendChild(el("div","tiny","Po Tat (葡撻) · born June 7, 2026 · "+DB.events.length+" entries logged · build "+BUILD));
  });
}
function toCSV(){
  var rows=[["date","time","event","end_time","duration_min","details","note"]];
  DB.events.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(e){
    var t=typeOf(e.t);
    rows.push([dayKey(e.ts),fmtTime(e.ts),t.lb,e.end?fmtTime(e.end):"",
      e.end?Math.round((e.end-e.ts)/60000):"",metaText(e),(e.n||"").replace(/\n/g," ")]);
  });
  DB.weights.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(w){
    rows.push([dayKey(w.ts),fmtTime(w.ts),"Weight","","",w.w+" lb",""]);
  });
  return rows.map(function(r){return r.map(function(c){
    c=String(c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",");}).join("\n");
}
function download(text,name,mime){
  try{
    var b=new Blob([text],{type:mime});
    var u=URL.createObjectURL(b);
    var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},2000);
  }catch(e){prompt("Copy this:",text);}
}
function applyTheme(){
  var t=DB.settings.theme||"auto";
  if(t==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
}

function renderAll(){
  renderStats();
  if(TAB==="day")renderDay();
  else if(TAB==="care")renderCare();
  else if(TAB==="soc")renderSoc();
  else if(TAB==="rec")renderRec();
  else if(LOGSUB==="today")renderToday();
  else if(LOGSUB==="hist")renderHist();

}

function logSegs(){

$("#gear").onclick=openSettings;

setInterval(function(){
  document.querySelectorAll("[data-live]").forEach(function(n){
    var ev=evById(n.dataset.live);if(ev)n.textContent=fmtDur(dur(ev));

  if(TAB==="log"){renderStats();}

document.addEventListener("visibilitychange",function(){if(!document.hidden)renderAll();});

applyTheme();
renderAll();
